  <style>
    /* Critical CSS - Surface et typographie */
    :root {
      color-scheme: dark light;
    }
  
    body {
      margin: 0;
      font-family: var(--font-family-base, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      background: var(--color-background, #05070d);
      color: var(--color-text-primary, #f9fafb);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  
    .container {
      width: min(100% - 2rem, var(--max-width-container, 1200px));
      margin-inline: auto;
    }
  
    .hero {
      padding-block: clamp(3rem, 6vw, 5rem);
      text-align: center;
    }
  
    .platform-grid {
      display: grid;
      gap: var(--grid-gap, 1.5rem);
      grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr));
      padding-block: clamp(2rem, 4vw, 3rem);
    }
  
    .platform-card {
      background: var(--color-surface, #111827);
      border-radius: var(--radius-lg, 1.25rem);
      border: 1px solid var(--color-border, rgba(255, 255, 255, 0.08));
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: var(--shadow-soft, 0 20px 45px rgba(3, 7, 18, 0.45));
      transition: transform var(--duration-standard, 250ms) var(--ease-standard, cubic-bezier(0.4, 0, 0.2, 1));
    }
  
    .platform-card:focus-visible,
    .platform-card:hover {
      transform: translateY(-6px);
      border-color: var(--color-border-strong, rgba(59, 130, 246, 0.65));
    }
  
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-sm, 0.5rem);
      background: var(--color-surface-alt, #162033);
      color: var(--color-text-secondary, #d1d5db);
      font-size: var(--font-size-sm, 0.875rem);
    }
  
    .cta-button {
      align-self: flex-start;
      min-height: var(--size-touch-min, 44px);
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md, 0.875rem);
      background: linear-gradient(135deg, var(--color-accent, #22d3ee), var(--color-accent-strong, #0ea5e9));
      color: var(--color-text-inverse, #0f172a);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: box-shadow 180ms var(--ease-standard);
    }
  
    .cta-button:focus-visible,
    .cta-button:hover {
      box-shadow: 0 0 0 3px var(--color-accent-soft, rgba(34, 211, 238, 0.16));
    }
  
    @media (max-width: 48rem) {
      .hero {
        text-align: left;
      }
    }
  </style>

      }
    }
  </script>
