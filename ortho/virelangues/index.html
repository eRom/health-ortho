<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virelangues – Rééducation Orthophonique en Ligne</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles/theme.css" />
  <link rel="stylesheet" href="/shared/styles/components.css" />
  <link rel="stylesheet" href="./styles.css" />
 
  
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="/manifest.json">
  <script type="application/ld+json">
              {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "Virelangues - Rééducation Orthophonique",
                "applicationCategory": "HealthApplication",
                "applicationSubCategory": "Speech Therapy",
                "operatingSystem": "Web",
                "description": "Application de rééducation orthophonique utilisant les virelangues pour améliorer l'élocution, la diction et les capacités articulatoires. Outil d'accompagnement aux séances d'orthophonie.",
                "url": "https://ortho.homeincloud.fr",
                "author": {
                  "@type": "Person",
                  "name": "Romain Ecarnot"
                },
                "keywords": [
                  "virelangues",
                  "orthophonie",
                  "rééducation orthophonique",
                  "élocution",
                  "diction",
                  "articulation",
                  "exercices vocaux",
                  "troubles de la parole",
                  "séances orthophoniste"
                ],
                "audience": {
                  "@type": "Audience",
                  "audienceType": [
                    "Patients en rééducation orthophonique",
                    "Orthophonistes",
                    "Personnes avec troubles de la parole"
                  ]
                },
                "featureList": [
                  "96 virelangues français",
                  "Sélection aléatoire quotidienne",
                  "Interface mobile-first",
                  "Anti-répétition journalière",
                  "Exercices d'articulation pour orthophonie"
                ],
                "accessibilityFeature": [
                  "alternativeText",
                  "highContrast",
                  "largePrint"
                ],
                "browserRequirements": "HTML5, JavaScript enabled",
                "permissions": "localStorage",
                "installUrl": "https://ortho.homeincloud.fr",
                "screenshot": "https://ortho.homeincloud.fr/screenshot.png"
              }
              </script>
</head>

<body>
  <header class="app-header" role="banner">
    <div class="container">
      <div class="header-meta">
        <a class="breadcrumb-link" href="../ortho.html">
          ← Retour aux exercices
        </a>
      </div>
      <h1>Virelangues</h1>
      <p class="subtitle">
        Un nouveau défi d'élocution à chaque clic, sans répétition dans la
        même journée.
      </p>
    </div>
  </header>
  <main class="app-main" role="main">
    <div class="container">
      <section class="phrase-card" aria-live="polite" aria-atomic="true">
        <p id="phrase" class="phrase-text"></p>
      </section>
      <div class="controls">
        <button id="newPhraseButton" class="primary-button" type="button">
          Nouvelle phrase
        </button>
        <button id="resetButton" class="reset-button" type="button" aria-live="polite">
          Réinitialiser
        </button>
        </div>
        <p id="status" class="status-text" role="status"></p>
        </div>
        </main>
  <footer class="app-footer" role="contentinfo">
    <div class="container">
      <p>
        <span>© <span id="footer-year"></span> Romain Ecarnot / v1.0.0</span>
      </p>
    </div>
  </footer>
  <script type="module" src="./script.js"></script>
</body>

</html>
